components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    BusyRange:
      type: object
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ReservationStatusEnum'
        is_overdue:
          type: boolean
          description: Overdue items stay busy until returned, so end_at is the end
            of the window.
      required:
      - end_at
      - is_overdue
      - start_at
      - status
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - id
      - kind
      - name
      - slug
    ConditionEnum:
      enum:
      - excellent
      - good
      - fair
      - needs_repair
      type: string
      description: |-
        * `excellent` - Excellent
        * `good` - Good
        * `fair` - Fair
        * `needs_repair` - Needs repair
    CurrentUser:
      type: object
      description: The signed-in user, including the role the frontend uses to shape
        its navigation.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        student_number:
          type: string
          readOnly: true
          nullable: true
        course:
          type: string
          maxLength: 120
        year:
          type: integer
          maximum: 7
          minimum: 1
          nullable: true
          description: Year of study.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        role:
          type: string
          readOnly: true
      required:
      - email
      - full_name
      - id
      - is_staff
      - role
      - student_number
      - username
    Equipment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        kind:
          type: string
          readOnly: true
        location:
          type: integer
        location_name:
          type: string
          readOnly: true
        building:
          type: string
          readOnly: true
        asset_tag:
          type: string
          maxLength: 30
        description:
          type: string
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        is_active:
          type: boolean
          description: Inactive items are retired and cannot be reserved.
        max_loan_days:
          type: integer
          maximum: 90
          minimum: 1
          description: Longest reservation allowed for this item, in days.
        is_reservable:
          type: boolean
          readOnly: true
        is_checked_out:
          type: boolean
          readOnly: true
          default: false
      required:
      - asset_tag
      - building
      - category
      - category_name
      - id
      - is_checked_out
      - is_reservable
      - kind
      - location
      - location_name
      - name
    EquipmentAvailability:
      type: object
      properties:
        equipment:
          type: integer
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        is_reservable:
          type: boolean
          description: False for retired items and items waiting for repair.
        is_available:
          type: boolean
          description: Reservable and free for the whole window.
        busy:
          type: array
          items:
            $ref: '#/components/schemas/BusyRange'
      required:
      - busy
      - equipment
      - from
      - is_available
      - is_reservable
      - to
    KindEnum:
      enum:
      - lab
      - sports
      type: string
      description: |-
        * `lab` - Lab
        * `sports` - Sports
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        building:
          type: string
          maxLength: 120
      required:
      - building
      - id
      - name
